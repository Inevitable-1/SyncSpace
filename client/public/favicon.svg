<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- White tile -->
  <rect x="1" y="1" width="62" height="62" rx="16" fill="#FFFFFF" stroke="#D4AF37" stroke-opacity="0.45" />

  <!-- Network ring: outer nodes connected to their neighbors -->
  <path
    d="M32 53 L50.2 42.5 L50.2 21.5 L32 11 L13.8 21.5 L13.8 42.5 Z"
    stroke="#D4AF37"
    stroke-width="2.6"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
    opacity="0.95"
  />

  <!-- Network spokes: every outer node connected to the center -->
  <path
    d="M32 32 L32 53 M32 32 L50.2 42.5 M32 32 L50.2 21.5 M32 32 L32 11 M32 32 L13.8 21.5 M32 32 L13.8 42.5"
    stroke="#D4AF37"
    stroke-width="2.6"
    stroke-linecap="round"
    fill="none"
    opacity="0.95"
  />

  <!-- Outer nodes -->
  <circle cx="32" cy="53" r="3.1" fill="#D4AF37" />
  <circle cx="50.2" cy="42.5" r="3.1" fill="#D4AF37" />
  <circle cx="50.2" cy="21.5" r="3.1" fill="#D4AF37" />
  <circle cx="32" cy="11" r="3.1" fill="#D4AF37" />
  <circle cx="13.8" cy="21.5" r="3.1" fill="#D4AF37" />
  <circle cx="13.8" cy="42.5" r="3.1" fill="#D4AF37" />

  <!-- Central hub -->
  <circle cx="32" cy="32" r="4.6" fill="#DC143C" />
</svg>
