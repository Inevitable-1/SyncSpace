services:
  mongo:
    image: mongo:7
    container_name: syncspace-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: syncspace
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: syncspace-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    container_name: syncspace-server
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: "5000"
      MONGODB_URI: mongodb://mongo:27017/syncspace
      CLIENT_URL: http://localhost:5173
      JWT_SECRET: dev-secret-change-in-production
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./server/src:/app/server/src
    command: npm run dev

  client:
    build:
      context: .
      dockerfile: docker/Dockerfile.client
    container_name: syncspace-client
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:5000
    depends_on:
      - server
    volumes:
      - ./client/src:/app/client/src

volumes:
  mongo-data:
  redis-data:
